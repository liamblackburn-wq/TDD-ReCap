<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="../static/js/login.js" defer></script>
</head>
<body>

  <header>
      <h1>Apprentice Duties</h1>
      <a id="logs-link" class="hidden" href="/logs">Logs</a>
  </header>

  <div id="login-view" class="container">
    <h2>Sign In</h2>
    <form id="login-form">
<!--      TODO: Strip whitespace from username-->
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Username">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password">
      <button class="login-btn" id="login-button" type="submit">Login</button>
    </form>
    <button class="guest-login-btn" id="guest-login">Login as guest</button>
  </div>

</body>
</html>

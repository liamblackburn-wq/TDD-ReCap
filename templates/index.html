<!DOCTYPE html>
<html lang="en">

<head>
  <title>Apprentice Duties</title>
  <link rel="stylesheet" href="../static/css/styles.css">
  <script src="../static/js/login.js" defer></script>
  <script src="../static/js/script.js" defer></script>
</head>

<body>

  <header>
    <h1>Apprentice Duties</h1>
  </header>

  <div id="login-view" class="container">
    <h2>Sign In</h2>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Username">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password">
      <button id="login-button" type="submit">Login</button>
    </form>
    <button id="guest-login">Login as guest</button>
  </div>

  <div id="dashboard-view" class="container hidden">
    <h1>Coins</h1>

    <ul id="coins-list" aria-label="Coin List">
    </ul>
  </div>

  <div id="user-view" class="container" hidden>
    <div class="button-group">
      <button id="create-duty">
        Create Duty
      </button>
      <form id="duty-form" class="hidden" aria-label="Create Duty Form" method="POST">
        <label for="duty-name">Duty Name:</label>
        <input
                type="text"
                id="duty-name"
                name="name"
                placeholder="e.g., Duty 1"
                required
        >
        <label for="duty-description">Duty Description:</label>
        <input
                type="text"
                id="duty-description"
                name="description"
                placeholder="Look to automate any manual tasks that are repeated, often using APIs."
                required
        >
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

  <div id="admin-view" class="container hidden">
    <div class="button-group">
      <button id="create-coin">
        Create Coin
      </button>
      <form id="coin-form" class="hidden" aria-label="Create Coin Form" method="POST">
        <label for="coin-name">Duty Name:</label>
        <input
                type="text"
                id="coin-name"
                name="name"
                placeholder="e.g., Automate!"
                required
        >
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

</body>

</html>

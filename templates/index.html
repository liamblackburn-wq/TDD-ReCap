<!DOCTYPE html>
<html lang="en">
<head>
  <title>Apprentice Duties</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>Apprentice Duties</h1>
  </header>
    <h2>Automate!</h2>
    <button id="add-duties">
      Add Duties
    </button>
    <ul id="automate_list" aria-label="Automate Duties List">
      {% for duty in added_duties %}
        <li class="listed_duty">
          <strong>{{ duty.Duty }}</strong> {{ duty.Description }
        </li>
      {% endfor %}
    </ul>
    <form id="form" class="hidden" aria-label="Add Duty Form" method="POST">
      <div class="checkbox-group">
        {% for duty in duties %}
          <input type="checkbox" id="{{ duty.replace(' ', '_') | lower }}" name="duties" value="{{ duty }}">
          <label for="{{ duty.replace(' ', '_') | lower }}">{{ duty }}</label>
        {% endfor %}
      </div>
      <button type="submit">Submit</button>
    </form>
</body>
</html>
